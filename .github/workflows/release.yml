name: Release APK

# Build a versioned release APK when a version tag is pushed (e.g. `git tag v1.2.0 &&
# git push origin v1.2.0`), and attach it to the matching GitHub Release. Also runnable
# manually from the Actions tab (produces an artifact, no release).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # create/update the Release and upload the APK asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: version
        run: |
          # v1.2.0 -> 1.2.0 (manual runs fall back to a dev name); versionCode is monotonic.
          NAME="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) : ;; *) NAME="0.0.0-dev${GITHUB_RUN_NUMBER}" ;; esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            # A PKCS12 keystore (keytool's modern default) uses one password for both the store
            # and the key, so KEY_PASSWORD is optional here — fall back to the store password.
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          EOF
            echo "Release signing configured."
          else
            echo "No signing secrets set — building a debug-signed APK (see build.gradle.kts fallback)."
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }} --no-daemon

      - name: Collect APK
        id: apk
        run: |
          mkdir -p out
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          DEST="out/homer-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: homer-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
