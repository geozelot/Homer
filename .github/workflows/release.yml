name: Release APK

# Build a versioned release APK when a version tag is pushed (e.g. `git tag v1.2.0 &&
# git push origin v1.2.0`), and attach it to the matching GitHub Release. Also runnable
# manually from the Actions tab (produces an artifact, no release).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # create/update the Release and upload the APK asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: version
        run: |
          # v1.2.0 -> 1.2.0 (manual runs fall back to a dev name); versionCode is monotonic.
          NAME="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) : ;; *) NAME="0.0.0-dev${GITHUB_RUN_NUMBER}" ;; esac
          # A beta tag is MOVED rather than re-cut, so the tag name alone never changes and every
          # build would call itself the same version — leaving the in-app updater with nothing
          # newer to offer. Appending the run number gives a name that still rises: AppVersion
          # compares the trailing digits numerically, so BETA.9 < BETA.10, and plain 2.0.0 beats
          # every BETA.n because a release outranks its own pre-releases.
          # The ASSET name stays stable per tag so a rebuild REPLACES the APK on the release
          # instead of adding a second one beside it; the rising version rides on the release
          # title, which is what the updater reads.
          ASSET="$NAME"
          case "$NAME" in *-BETA) NAME="${NAME}.${GITHUB_RUN_NUMBER}" ;; esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            # A PKCS12 keystore (keytool's modern default) uses one password for both the store
            # and the key, so KEY_PASSWORD is optional here — fall back to the store password.
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          EOF
            echo "Release signing configured."
          else
            echo "No signing secrets set — building a debug-signed APK (see build.gradle.kts fallback)."
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }} --no-daemon

      - name: Collect APK
        id: apk
        run: |
          mkdir -p out
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          DEST="out/homer-${{ steps.version.outputs.asset }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          # The R8 mapping, without which a stack trace from a release build is unreadable —
          # every Homer frame comes back as `jn.v` / `qp3.l` and the report is worth nothing.
          # It only exists on the runner, so it has to leave with the APK or it is gone with the
          # machine. R8 stamps each trace with an `r8-map-id-<hash>` matching the file that
          # decodes it, so a trace can always be paired with the right build's mapping.
          #
          # Gzipped, and not out of tidiness: the raw file is ~67MB against a ~4MB APK, sixteen
          # times the app it explains, and a beta line cuts a lot of builds. It compresses to ~5MB.
          # To read a trace: gunzip it and run R8's retrace with the file whose `pg_map_id` header
          # matches the `r8-map-id-` in the trace.
          MAP=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAP" ]; then
            DEST_MAP="out/homer-${{ steps.version.outputs.asset }}-mapping.txt.gz"
            gzip -9 -c "$MAP" > "$DEST_MAP"
            echo "mapping=$DEST_MAP" >> "$GITHUB_OUTPUT"
            echo "Collected the R8 mapping: $(du -h "$MAP" | cut -f1) -> $(du -h "$DEST_MAP" | cut -f1)."
          else
            # Not fatal: a build with minification off has nothing to map.
            echo "::warning::No R8 mapping at $MAP — release stack traces will not be decodable."
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: homer-${{ steps.version.outputs.name }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.mapping }}
          # A manual run with minification off produces no mapping; the APK is still the point.
          if-no-files-found: warn
          overwrite: true

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The mapping rides along with the release rather than only as a build artifact:
          # artifacts expire, and the trace that needs decoding usually arrives months later.
          # Safe to attach — the in-app updater selects by `.apk` suffix (see GitHubReleaseSource),
          # so an extra asset is invisible to it, and there is nothing to keep secret in a mapping
          # file for a GPLv3 app whose source is right here.
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.mapping }}
          fail_on_unmatched_files: false
          # A tag carrying a pre-release suffix (v2.0.0-BETA, v2.1.0-rc1) is marked as one, so
          # `/releases/latest` keeps pointing at the last finished release. The in-app updater's
          # Stable channel relies on this flag to tell a beta from a release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The release TITLE carries the build's real version. A moving beta tag cannot: it
          # names every build alike, so the updater reads this instead and sees each one rise.
          name: ${{ steps.version.outputs.name }}
